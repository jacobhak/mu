# This machine's build settings (scripts/start.sh writes sccache there); git-ignored.
include = [{ path = "local.toml", optional = true }]

# Features resolved once for the whole workspace, so `cargo test -p <crate>` reuses the workspace build
# instead of compiling that crate and its dependencies again under another feature set.
[unstable]
feature-unification = true
checksum-freshness = true

[resolver]
feature-unification = "workspace"

# Freshness by content, not modification time: a fresh checkout (a CI job, a bundle) reuses outputs built
# elsewhere from the same sources. Build scripts' rerun-if-changed paths still go by modification time.
[build]
fingerprint = "content"
