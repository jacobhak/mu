name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: arc-mu
    # A hung step otherwise holds the runner for GitHub's 6 h default.
    timeout-minutes: 60
    env:
      # This runner reserves 2 cores; cargo would otherwise use every core it can see.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - run: scripts/ci-checks.sh
      - name: publish offload base
        if: github.event_name == 'push' && vars.OFFLOAD_REGISTRY != ''
        env:
          REGISTRY: ${{ vars.OFFLOAD_REGISTRY }}
        run: scripts/publish-offload-base.sh
      - run: df -h / && du -sh target
        if: always()
  check-arm64:
    # The same checks on arm64, and the arm64 half of offload's base image. Main only.
    if: github.event_name == 'push' && vars.OFFLOAD_REGISTRY != ''
    runs-on: arc-mu-arm64
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - run: scripts/ci-checks.sh
      - name: publish offload base
        env:
          REGISTRY: ${{ vars.OFFLOAD_REGISTRY }}
        run: scripts/publish-offload-base.sh
  offload-base:
    # Makes the multi-arch main from the per-arch bases. A failed arch keeps its previous, still valid base.
    needs: [check, check-arm64]
    if: ${{ !cancelled() && github.event_name == 'push' && vars.OFFLOAD_REGISTRY != '' }}
    runs-on: arc-mu
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: scripts/publish-offload-base.sh index
        env:
          REGISTRY: ${{ vars.OFFLOAD_REGISTRY }}
  macos:
    # macOS platform coverage on the self-hosted Mac. Branch protection needs a
    # paid plan on a private repo, so nothing here gates a merge.
    # A JIT-provisioned runner carries only the labels it was created with, so
    # there is no implicit self-hosted or macOS label to match on.
    runs-on: mu-ci
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - run: scripts/ci-checks.sh
