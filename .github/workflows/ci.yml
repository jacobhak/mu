name: ci
# Timing experiment, not for merging: the checks without rust-cache's restore, at 2 and 4 build jobs.
on:
  pull_request:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: arc-mu
    strategy:
      fail-fast: false
      matrix:
        jobs: [2, 4]
    name: check (no cache, ${{ matrix.jobs }} jobs)
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - run: nproc && cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
      - run: scripts/ci-checks.sh
      - run: df -h / && du -sh target
        if: always()
  macos:
    runs-on: mu-ci
    name: macos (no cache)
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - run: scripts/ci-checks.sh
