name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Four workspace builds (clippy and test, with and without default features) must fit the runner's ~14 GB disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: df -h / && du -sh target
        if: always()
      - run: scripts/build-mcp-http.sh test
      - run: node --test scripts/maint/gen-catalog.test.mjs
      - run: bun test content.test.ts
        working-directory: plugins/memory
