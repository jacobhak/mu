name: release
on:
  push:
    tags: ['mu-*']
  # Dry run: builds and tests both platforms without publishing a release.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # The Linux build runs in ubuntu:22.04, so the binary's glibc floor is 2.35.
  build-linux:
    runs-on: arc-mu
    container: ubuntu:22.04
    env:
      # The container installs shellcheck below, so here a missing one is a failure.
      MU_REQUIRE_SHELLCHECK: 1
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential git pkg-config python3 nodejs shellcheck
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # See ci.yml: cache-bin prunes the runner's own ~/.cargo/bin.
          cache-bin: false
      - run: scripts/ci-checks.sh
      - run: cargo build --release --workspace --locked
      - run: scripts/build-mcp-http.sh build
      - run: scripts/package.sh linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: mu-linux-x64
          path: dist/mu-linux-x64.tar.gz
          # Only the release job reads it; the published copy is the release asset.
          retention-days: 1
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: mu-ci, plat: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # See ci.yml: cache-bin prunes the runner's own ~/.cargo/bin.
          cache-bin: false
      - run: scripts/ci-checks.sh
      - run: cargo build --release --workspace --locked
      - run: scripts/build-mcp-http.sh build
      - run: scripts/package.sh ${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with:
          name: mu-${{ matrix.plat }}
          path: dist/mu-${{ matrix.plat }}.tar.gz
          retention-days: 1
  release:
    needs: [build, build-linux]
    # A manual run exercises the matrix; only a tag publishes.
    if: github.event_name == 'push'
    runs-on: arc-mu
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" \
            --notes "omp $(git show "$GITHUB_REF_NAME:upstream.toml" | sed -n 's/^omp = "\(.*\)"/\1/p')"
