name: release
on:
  push:
    tags: ['mu-*']
  # Dry run: builds and tests both platforms without publishing a release.
  workflow_dispatch:
# Builds only read the repository; the release job below adds what publishing needs.
permissions:
  contents: read
jobs:
  # The Linux build runs in ubuntu:22.04, so the binary's glibc floor is 2.35.
  build-linux:
    # Same-repo guard as ci.yml: a no-op while only tags and manual runs trigger this, but it keeps a
    # fork PR trigger added later off the self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-mu
    # A hung step otherwise holds the runner for GitHub's 6 h default.
    timeout-minutes: 60
    container: ubuntu:22.04
    env:
      # The container installs shellcheck below, so here a missing one is a failure.
      MU_REQUIRE_SHELLCHECK: 1
      MU_REQUIRE_JQ: 1
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential git pkg-config python3 shellcheck libatomic1 jq
      # Ubuntu 22.04's apt nodejs is 12.x; ci-checks.sh needs `node --test` (18+).
      - run: |
          curl -sSfO https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.gz
          echo "518674de2b621728a5e4486f5fb3b7d2900bb3cc4aa97969edaa463db99f9778  node-v26.13.1-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf node-v26.13.1-linux-x64.tar.gz -C /usr/local --strip-components=1 --no-same-owner
          rm node-v26.13.1-linux-x64.tar.gz
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      # The checkout is owned by another uid inside the container; without this every git command
      # (scripts/shellcheck.sh's `git ls-files`) fails with "dubious ownership".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: rustup toolchain install
      - run: scripts/ci-checks.sh
      - run: cargo build --release --workspace --locked
      - run: scripts/build-mcp-http.sh build
      - run: scripts/package.sh linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: mu-linux-x64
          path: dist/mu-linux-x64.tar.gz
          # Only the release job reads it; the published copy is the release asset.
          retention-days: 1
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: mu-ci, plat: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: scripts/ci-checks.sh
      - run: cargo build --release --workspace --locked
      - run: scripts/build-mcp-http.sh build
      - run: scripts/package.sh ${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with:
          name: mu-${{ matrix.plat }}
          path: dist/mu-${{ matrix.plat }}.tar.gz
          retention-days: 1
  release:
    needs: [build, build-linux]
    # A manual run exercises the matrix; only a tag publishes.
    if: github.event_name == 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: arc-mu
    timeout-minutes: 60
    permissions:
      contents: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      # install.sh verifies the attestation when the release has one.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" \
            --notes "oh-my-pi crates $(git show "$GITHUB_REF_NAME:upstream.toml" | sed -n 's/^omp = "\(.*\)"/\1/p')"
