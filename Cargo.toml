[package]
name = "mu"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["crates/mu-agent", "crates/mu-common", "crates/mu-base", "crates/mu-bench", "crates/mu-provider", "crates/mu-session", "crates/mu-testutil", "crates/mu-tools", "crates/mu-tui", "plugins/gateway", "plugins/memory", "plugins/predict", "plugins/web"]
exclude = ["plugins/mcp-http"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mu-agent = { path = "crates/mu-agent" }
mu-common = { path = "crates/mu-common" }
mu-base = { path = "crates/mu-base" }
mu-testutil = { path = "crates/mu-testutil" }
mu-provider = { path = "crates/mu-provider" }
mu-session = { path = "crates/mu-session" }
mu-tools = { path = "crates/mu-tools" }
mu-tui = { path = "crates/mu-tui" }
pi-edit = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
pi-shell = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
pi-diff = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
pi-walker = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
encoding_rs = "0.8"
httpdate = "1"
tokio = "1"
tokio-util = "0.7"
serde_yaml_ng = "0.10"
toml = "1"
toml_edit = "0.25"
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-diff = "0.1"
tree-sitter-md = "0.5"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-regex = "0.25"
base64 = "0.22"
terminput = "0.5"
terminput-crossterm = { version = "0.4", default-features = false, features = ["crossterm_0_28"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flume = "0.12"
async-trait = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7"] }
jiff = "0.2"
anyhow = "1"
libc = "0.2"
vt100 = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
unicode-segmentation = "1.13"
sha2 = "0.11.1"
ring = "0.17"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }

[dependencies]
mu-common.workspace = true
mu-agent.workspace = true
mu-base.workspace = true
mu-provider.workspace = true
mu-session.workspace = true
mu-tools.workspace = true
mu-tui.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "time", "sync", "process", "io-util", "io-std", "fs", "net"] }
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
jiff.workspace = true
anyhow.workspace = true
libc.workspace = true

[dev-dependencies]
base64.workspace = true
mu-common = { workspace = true, features = ["test-support"] }
mu-testutil.workspace = true
mu-agent = { workspace = true, features = ["test-support"] }
mu-provider = { workspace = true, features = ["test-support"] }
mu-tools = { workspace = true, features = ["test-support"] }

[patch.crates-io]
tree-sitter-go = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
grep-searcher = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
jaq-core = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
jaq-json = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }
jaq-std = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.20.0" }

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
