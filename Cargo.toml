[package]
name = "mu"
version.workspace = true
edition.workspace = true
license.workspace = true

[workspace]
members = ["crates/mu-common", "crates/mu-base", "crates/mu-bench", "crates/mu-provider", "crates/mu-session", "crates/mu-testutil", "crates/mu-tools", "plugins/gateway", "plugins/memory-shim", "plugins/predict", "plugins/web"]
exclude = ["plugins/mcp-http"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mu-common = { path = "crates/mu-common" }
mu-base = { path = "crates/mu-base" }
mu-testutil = { path = "crates/mu-testutil" }
mu-provider = { path = "crates/mu-provider" }
mu-session = { path = "crates/mu-session" }
mu-tools = { path = "crates/mu-tools" }
pi-edit = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
pi-shell = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
pi-diff = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
pi-walker = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
tokio = "1"
tokio-util = "0.7"
serde_yaml_ng = "0.10"
toml = "1"
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-diff = "0.1"
tree-sitter-md = "0.5"
base64 = "0.22"
terminput = "0.5"
terminput-crossterm = { version = "0.4", default-features = false, features = ["crossterm_0_28"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
flume = "0.12"
async-trait = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7"] }
jiff = "0.2"
anyhow = "1"
libc = "0.2"
vt100 = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
unicode-segmentation = "1.13"
sha2 = "0.11.1"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }

[features]
default = ["lang-rust", "lang-json", "lang-bash", "lang-toml", "lang-yaml", "lang-python", "lang-javascript", "lang-typescript", "lang-diff", "lang-markdown"]
all-langs = ["lang-rust", "lang-json", "lang-bash", "lang-toml", "lang-yaml", "lang-python", "lang-javascript", "lang-typescript", "lang-diff", "lang-markdown"]
highlight = ["dep:tree-sitter", "dep:tree-sitter-highlight"]
lang-rust = ["highlight", "dep:tree-sitter-rust"]
lang-json = ["highlight", "dep:tree-sitter-json"]
lang-bash = ["highlight", "dep:tree-sitter-bash"]
lang-toml = ["highlight", "dep:tree-sitter-toml-ng"]
lang-yaml = ["highlight", "dep:tree-sitter-yaml"]
lang-python = ["highlight", "dep:tree-sitter-python"]
lang-javascript = ["highlight", "dep:tree-sitter-javascript"]
lang-typescript = ["lang-javascript", "dep:tree-sitter-typescript"]
lang-diff = ["highlight", "dep:tree-sitter-diff"]
lang-markdown = ["highlight", "dep:tree-sitter-md"]

[dependencies]
mu-common.workspace = true
mu-base.workspace = true
mu-provider.workspace = true
mu-session.workspace = true
mu-tools.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "time", "sync", "process", "io-util", "io-std", "fs", "net"] }
tokio-util.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-diff = { workspace = true, optional = true }
tree-sitter-md = { workspace = true, optional = true }
base64.workspace = true
terminput.workspace = true
terminput-crossterm.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid.workspace = true
jiff.workspace = true
anyhow.workspace = true
libc.workspace = true
vt100.workspace = true
unicode-segmentation.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
mu-testutil.workspace = true
mu-provider = { workspace = true, features = ["test-support"] }
mu-tools = { workspace = true, features = ["test-support"] }

[patch.crates-io]
brush-core   = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
brush-parser = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
tree-sitter-go = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }
grep-searcher = { git = "https://github.com/can1357/oh-my-pi", tag = "v18.16.0" }

[profile.release]
strip = true
