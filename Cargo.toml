[package]
name = "ai-provider-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A shared, lease-managed gateway to the AI providers an omp login can reach"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time", "process"] }

[lints.clippy]
unwrap_used = "warn"
