[package]
name = "mu-gateway"
version = "0.1.0"
edition = "2024"
description = "mu's gateway provider plugin: a shared, lease-managed gateway to the AI providers an omp login can reach"

[dependencies]
mu-common = { path = "../../crates/mu-common" }
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
libc.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2_10.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-std", "io-util", "sync", "time", "process"] }

[lints]
workspace = true
