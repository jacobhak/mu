[package]
name = "mu-mcp-http"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "mu-mcp-http"
path = "src/main.rs"

[dependencies]
# Apache-2.0. Only this bridge uses rmcp; see THIRD-PARTY-NOTICES.md.
rmcp = { version = "3.8", default-features = false, features = ["client", "auth", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "time", "net", "sync"] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "auth", "server", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "time", "process", "net"] }

# The workspace's dev profile (../../Cargo.toml) does not reach this separate project.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
