[package]
name = "mu-memory"
version = "0.1.0"
edition = "2024"

[dependencies]
mu-common = { path = "../../crates/mu-common" }
mu-base = { path = "../../crates/mu-base" }
mu-session = { path = "../../crates/mu-session" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util", "sync", "fs"] }
toml = "1"
uuid = { workspace = true }

[lints]
workspace = true
