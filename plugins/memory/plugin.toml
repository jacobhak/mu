name = "memory"
command = ["mu-memory"]
lifetime = "idle:10m"
hooks = ["prompt_submit", "pre_compaction", "session_end"]

[[tools]]
name = "memory"
description = "Long-term memory kept as short markdown files in git: who the user is, how they want work done, and facts about this repository that the code does not show. `read` shows the current state or one note; `edit` applies a batch of add/replace/remove/write_note/delete_note ops at once. Save only what is durable and was said or confirmed by the user."
schema = "schemas/memory.json"

[[tools]]
name = "session_search"
description = "Keyword search over past sessions (user and assistant text), ranked by relevance. Use it to find what was said or decided in an earlier session. `scope` is `repo` (this repository, all its worktrees) or `all`."
schema = "schemas/session_search.json"
