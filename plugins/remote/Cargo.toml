[package]
name = "mu-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Remotes for mu: agents and tasks on other machines, over an encrypted channel"
publish = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
snow = "0.10"
tokio = { workspace = true, features = ["rt", "macros", "signal", "time", "sync", "process", "io-util", "io-std", "fs", "net"] }
tokio-util.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "encryption"] }

[lints]
workspace = true
