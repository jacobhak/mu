# Pod template for adapters/mu-remote-pod. The script replaces every placeholder written between two at signs
# itself (no envsubst), comments included, so no comment may name one; string values arrive already escaped for a
# double-quoted YAML scalar. The envFrom placeholder is empty on an untrusted remote.
apiVersion: v1
kind: Pod
metadata:
  name: "@NAME@"
  namespace: "@NAMESPACE@"
  labels:
    app: mu-task
    mu-kind: "@KIND@"
    mu-launcher: "@LAUNCHER@"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
@DEADLINE_LINE@
  containers:
    - name: worker
      image: "@IMAGE@"
      imagePullPolicy: "@PULL_POLICY@"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      # The workspace mount point is owned by root, which git refuses without safe.directory.
      # A cluster CA may sign the certificate of the object store sccache connects to; appended to a copy of the
      # system roots (the image is not writable by the worker) so crate downloads keep the public ones.
      command: ["sh", "-c"]
      args: ["git config --global --add safe.directory '*'; cp /etc/ssl/certs/ca-certificates.crt \"$HOME/ca-bundle.crt\"; [ ! -f /etc/mu-ca/ca.crt ] || cat /etc/mu-ca/ca.crt >> \"$HOME/ca-bundle.crt\"; exec sleep infinity"]
      env:
        - {name: HOME, value: /home/worker}
        - {name: SSL_CERT_FILE, value: /home/worker/ca-bundle.crt}
@ENV@
@ENVFROM@
      resources:
        requests:
          cpu: "@CPU@"
          memory: "@MEMORY@"
      volumeMounts:
        - {name: home, mountPath: /home/worker}
        - {name: workspace, mountPath: "@ROOT@"}
        - {name: cluster-ca, mountPath: /etc/mu-ca, readOnly: true}
  volumes:
    - {name: home, emptyDir: {}}
    - {name: workspace, emptyDir: {}}
    - name: cluster-ca
      configMap:
        name: kube-root-ca.crt
        optional: true
