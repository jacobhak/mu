apiVersion: v1
kind: ServiceAccount
metadata:
  name: mu-agent
  namespace: mu-agent
---
# What the agent pod's own mu-remote-pod needs to run workers, in mu-workers only: no secrets, no ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mu-agent-workers
  namespace: mu-workers
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # `kubectl wait` watches the pod it created.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mu-agent-workers
  namespace: mu-workers
subjects:
  - kind: ServiceAccount
    name: mu-agent
    namespace: mu-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mu-agent-workers
