# Pod template for scripts/remote/pod-run.sh. The script replaces every @NAME@ placeholder itself (no envsubst);
# string values arrive already escaped for a double-quoted YAML scalar.
apiVersion: v1
kind: Pod
metadata:
  name: "@NAME@"
  namespace: "@NAMESPACE@"
  labels:
    app: mu-task
    mu/parent: "@PARENT@"
  annotations:
    mu/host: "@HOST@"
    mu/pid: "@PID@"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: @DEADLINE@
  containers:
    - name: worker
      image: "@IMAGE@"
      imagePullPolicy: "@PULL_POLICY@"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      # A cluster CA may sign the certificate of the object store sccache connects to; appended to a copy of the
      # system roots (the image is not writable by the worker) so crate downloads keep the public ones.
      command: ["sh", "-c"]
      args: ["cp /etc/ssl/certs/ca-certificates.crt \"$HOME/ca-bundle.crt\"; [ ! -f /etc/mu-ca/ca.crt ] || cat /etc/mu-ca/ca.crt >> \"$HOME/ca-bundle.crt\"; exec sleep infinity"]
      env:
        - {name: HOME, value: /home/worker}
        - {name: SSL_CERT_FILE, value: /home/worker/ca-bundle.crt}
@ENV@
      envFrom:
        - secretRef:
            name: "@SCCACHE_SECRET@"
            optional: true
      resources:
        requests:
          cpu: "@CPU@"
          memory: "@MEMORY@"
      volumeMounts:
        - {name: home, mountPath: /home/worker}
        - {name: workspace, mountPath: "@ROOT@"}
        - {name: cluster-ca, mountPath: /etc/mu-ca, readOnly: true}
  volumes:
    - {name: home, emptyDir: {}}
    - {name: workspace, emptyDir: {}}
    - name: cluster-ca
      configMap:
        name: kube-root-ca.crt
        optional: true
